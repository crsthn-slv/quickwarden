[package]
name = "quick-access"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
security-framework = { version = "3.7.0", features = ["OSX_10_15"] }
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-local-authentication = { version = "0.3.2", features = ["LAContext", "LAError", "block2"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSError", "NSNotification", "NSDistributedNotificationCenter", "NSOperation", "block2"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSPasteboard", "NSWorkspace", "NSWindow", "NSResponder", "NSGraphics", "block2"] }
