<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Quick Access</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="panel">
  <div id="search">
    <span id="folder" hidden></span>
    <input id="q" type="text" placeholder="Pesquisar no Bitwarden" aria-label="Pesquisar no cofre" role="combobox" aria-controls="body" aria-expanded="true" aria-autocomplete="list" autocomplete="off" spellcheck="false" autofocus>
  </div>
  <div id="toast" role="status" aria-live="assertive"></div>
  <div id="body" role="listbox" aria-label="Itens do cofre"></div>
  <div id="bar"></div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
